name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: 1.5.0
  ESP32_CORE_VERSION: 3.3.9
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.2

jobs:
  source-audit:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version metadata
        run: python3 scripts/check_version_consistency.py

      - name: Validate Strata contract
        run: python3 scripts/check_strata_contract.py

      - name: Audit production sources
        run: |
          set -e
          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi

          if grep -RInE 'heap_caps_|MALLOC_CAP_|ps_malloc|xTaskCreate|xQueueCreate|xSemaphoreCreate|std::make_unique|std::make_shared' src; then
            echo "Scout allocations and owned FreeRTOS primitives must route through Strata"
            exit 1
          fi

          if grep -RInE 'etharp_request|etharp_find_addr|netif_get_by_index|esp_netif_get_netif_impl' src | grep -v 'src/internal/ScoutNetwork.cpp'; then
            echo "lwIP core access must stay behind ScoutNetwork"
            exit 1
          fi

  build-examples:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-scout-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-scout-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-

      - name: Install PIOArduino
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install ESP32 platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build examples
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board ${{ matrix.board }} \
                --lib="." \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_VERSION}" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done

  arduino-cli:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: esp32:esp32:esp32s3
            name: esp32-s3-devkitc-1
          - fqbn: esp32:esp32:esp32c3
            name: esp32-c3-devkitm-1
          - fqbn: esp32:esp32:esp32p4
            name: esp32-p4-evboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: ${{ runner.os }}-scout-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-${{ env.ESP32_CORE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-scout-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Add local libraries to sketchbook
        run: |
          set -e
          SKETCHBOOK_DIR="${HOME}/Arduino"
          mkdir -p "$SKETCHBOOK_DIR/libraries/Scout"
          rsync -a --delete --exclude ".git" ./ "$SKETCHBOOK_DIR/libraries/Scout/"
          rm -rf "$SKETCHBOOK_DIR/libraries/Strata"
          git clone --depth 1 --branch "${STRATA_VERSION}" \
            https://github.com/ZekStack/strata.git \
            "$SKETCHBOOK_DIR/libraries/Strata"

      - name: Build examples
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Compiling $d"
              arduino-cli compile \
                --fqbn "$FQBN" \
                --build-property "compiler.cpp.extra_flags=-std=gnu++20" \
                "$d"
            fi
          done

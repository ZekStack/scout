name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: scout-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ARDUINO_CLI_VERSION: 1.5.0
  ARDUINO_NETWORK_CONNECTION_TIMEOUT: 240s
  ESP32_CORE_VERSION: 3.3.9
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.3

jobs:
  whitespace:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" || -z "${BASE_SHA}" ]]; then
            git show --check --format= HEAD
          else
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          fi

  formatting:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install clang-format
        run: python -m pip install "clang-format==19.1.7"

      - name: Check production C++ formatting
        run: |
          find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  metadata:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package and tag versions
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/check_version.py
          fi

      - name: Test release changelog generation
        run: python3 tests/test_release_changelog.py

  source-audit:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production sources
        run: |
          set -e

          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi

          if grep -RInE '#include[[:space:]]+[<"](Accord|Curier|Flow|Fresh|Link|Lingo|Passage|Phase|Pulse|Seal|Signal|Tempo|Trace|Worker)\.h[>"]' src; then
            echo "Scout must not depend on another ZekStack library except Strata"
            exit 1
          fi

          if grep -RInE 'heap_caps_|MALLOC_CAP_|esp_heap_caps|ps_malloc[[:space:]]*\(' src; then
            echo "Scout allocation placement must go through Strata"
            exit 1
          fi

          if grep -RInE '(^|[^[:alnum:]_:])(malloc|calloc|realloc|free)[[:space:]]*\(|std::make_(unique|shared)[[:space:]]*<|(^|[^[:alnum:]_:])new[[:space:]]|(^|[^[:alnum:]_:])delete[[:space:]]' src; then
            echo "Scout-owned allocations must go through Strata"
            exit 1
          fi

          if grep -RInE 'xTaskCreate[A-Za-z]*[[:space:]]*\(|vTaskDelete[A-Za-z]*[[:space:]]*\(|xQueueCreate[A-Za-z]*[[:space:]]*\(|xSemaphoreCreate[A-Za-z]*[[:space:]]*\(' src; then
            echo "Scout-owned FreeRTOS primitives must go through Strata"
            exit 1
          fi

          if grep -RInE '#include[[:space:]]+[<"]esp_heap_caps\.h[>"]|freertos/idf_additions\.h' src; then
            echo "Scout must not depend on ESP-IDF allocation internals"
            exit 1
          fi

          if grep -RInE 'etharp_request|etharp_find_addr|netif_get_by_index|esp_netif_get_netif_impl' src \
            | grep -v 'src/internal/ScoutNetwork.cpp'; then
            echo "lwIP core access must stay behind ScoutNetwork"
            exit 1
          fi

      - name: Check Strata integration contract
        run: python3 scripts/check_strata_contract.py

  host-tests:
    runs-on: [self-hosted, zekstack-ci]
    needs: [metadata, source-audit, formatting]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run host logic tests
        run: bash tests/host/run.sh

  arduino-lint:
    runs-on: [self-hosted, zekstack-ci]
    needs: [metadata, source-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: false
          project-type: library

  build-examples:
    runs-on: [self-hosted, zekstack-ci]
    needs: [metadata, source-audit, host-tests]
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Isolate PlatformIO state
        run: echo "PLATFORMIO_CORE_DIR=${RUNNER_TEMP}/platformio" >> "${GITHUB_ENV}"

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install PIOArduino ESP32 Platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build library examples
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board ${{ matrix.board }} \
                --lib="." \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "framework=arduino" \
                --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_VERSION}" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done

  build-hybrid-p4:
    runs-on: [self-hosted, zekstack-ci]
    needs: [metadata, source-audit, host-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Isolate PlatformIO state
        run: echo "PLATFORMIO_CORE_DIR=${RUNNER_TEMP}/platformio-hybrid-p4" >> "${GITHUB_ENV}"

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Build hybrid ESP32-P4 smoke example
        run: |
          pio ci examples/Basic \
            --board esp32-p4-evboard \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "framework=arduino,espidf" \
            --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_VERSION}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

  arduino-cli:
    runs-on: [self-hosted, zekstack-ci]
    needs: [metadata, source-audit, host-tests]
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: esp32:esp32:esp32s3
            name: esp32-s3-devkitc-1
          - fqbn: esp32:esp32:esp32c3
            name: esp32-c3-devkitm-1
          - fqbn: esp32:esp32:esp32p4
            name: esp32-p4-evboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
              ;;
            aarch64|arm64)
              archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_ARM64.tar.gz"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/arduino-cli"
          url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"
          mkdir -p "$install_dir"

          curl --fail --location             --retry 5             --retry-all-errors             --retry-delay 2             --connect-timeout 15             --max-time 180             "$url"             --output "${RUNNER_TEMP}/${archive}"

          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$install_dir" arduino-cli
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/arduino-cli" version

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Add local libraries to sketchbook
        run: |
          set -e
          SKETCHBOOK_DIR="${HOME}/Arduino"
          mkdir -p "$SKETCHBOOK_DIR/libraries/Scout"
          rsync -a --delete --exclude ".git" ./ "$SKETCHBOOK_DIR/libraries/Scout/"
          rm -rf "$SKETCHBOOK_DIR/libraries/Strata"
          git clone --depth 1 --branch "${STRATA_VERSION}" \
            https://github.com/ZekStack/strata.git \
            "$SKETCHBOOK_DIR/libraries/Strata"

      - name: Build examples (${{ matrix.board.name }})
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Compiling $d"
              arduino-cli compile \
                --fqbn "$FQBN" \
                --build-property "compiler.cpp.extra_flags=-std=gnu++20" \
                "$d"
            fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - whitespace
      - formatting
      - metadata
      - source-audit
      - host-tests
      - arduino-lint
      - build-examples
      - arduino-cli
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

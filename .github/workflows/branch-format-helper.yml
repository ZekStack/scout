name: Branch format helper

on:
  push:
    branches:
      - runtime-correctness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-correctness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "clang-format==19.1.7"
      - name: Format source
        run: find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format -i
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Format runtime hardening changes"
            git push origin HEAD:runtime-correctness
          fi

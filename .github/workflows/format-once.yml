name: Format once

on:
  push:
    branches:
      - enrichment-identity
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: enrichment-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install clang-format
        run: python -m pip install "clang-format==19.1.7"

      - name: Format and commit production sources
        run: |
          find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format -i
          if git diff --quiet -- src; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Format production C++"
          git push origin HEAD:enrichment-identity

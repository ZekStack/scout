name: Validate once # board-smoke

on:
  push:
    branches:
      - enrichment-identity
    paths:
      - .github/workflows/validate-once.yml

env:
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.2

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enrichment-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clang-format
        run: python -m pip install "clang-format==19.1.7"
      - name: Check production formatting
        run: |
          find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Run host tests
        run: bash tests/host/run.sh

  board-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enrichment-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PIOArduino
        run: |
          python -m pip install "pioarduino==${PIOARDUINO_VERSION}"
          pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"
      - name: Compile Basic example
        run: |
          pio ci examples/Basic \
            --board "${{ matrix.board }}" \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_VERSION}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

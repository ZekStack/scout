name: Validate once

on:
  push:
    branches:
      - enrichment-identity
    paths:
      - .github/workflows/validate-once.yml

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enrichment-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clang-format
        run: python -m pip install "clang-format==19.1.7"
      - name: Check production formatting
        run: |
          find src -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Run host tests
        run: bash tests/host/run.sh
